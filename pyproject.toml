[project]
name = "sde-application-in-option-pricing-streamlit"
version = "0.1.0"
description = "Master's-level Streamlit proof of concept for GBM and LSMC put pricing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "matplotlib>=3.8,<4",
    "yfinance>=0.2,<1",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.poetry]
packages = [{ include = "option_pricing_app", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These two files intentionally preserve the dissertation source formatting.
"src/option_pricing_app/stats/*.py" = ["I001"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
